<style>

  :root{--ink:#10282A;--paper:#FBF6EA;--paper-dim:#F1E7D2;--gold:#E3A63E;--teal:#2C7A72;--text:#16302E;--line:#DDD0B4;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:#0B1C1E;}
  body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  #root{min-height:100%;}
  .shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;overflow-x:hidden}

  /* ---------- responsive shell ----------
     Mobile keeps the single 480px column. From 1024px the app becomes a
     three-column workspace: navigation, the working column, and context. */
  .app-grid{display:block}
  .col-left,.col-right{display:none}
  .col-center{min-width:0}

  @media (min-width:1024px){
    .shell{max-width:none;background:var(--paper-dim)}
    .app-grid{
      display:grid;
      grid-template-columns:248px minmax(0,1fr) 316px;
      gap:0;min-height:100vh;align-items:stretch;
    }
    .col-left{display:block;background:var(--ink);position:sticky;top:0;
      height:100vh;overflow-y:auto}
    .col-right{display:block;background:var(--paper);border-left:1px solid var(--line);
      position:sticky;top:0;height:100vh;overflow-y:auto}
    .col-center{background:var(--paper);border-left:1px solid var(--line);min-height:100vh}
    .center-pad{max-width:720px;margin:0 auto;padding:0 32px}
  }
  @media (min-width:1440px){
    .app-grid{grid-template-columns:280px minmax(0,1fr) 352px}
    .center-pad{max-width:820px}
  }

  /* Wider recommendation cards on desktop */
  .rec-card{width:100%}
  @media (min-width:1024px){
    .deck-stage{max-width:640px;margin:0 auto}
  }

  /* Landing */
  .landing-hero{padding:64px 24px 56px}
  @media (min-width:768px){ .landing-hero{padding:96px 48px 80px} }
  @media (min-width:1024px){ .landing-hero{padding:120px 64px 96px} }
  .landing-grid{display:grid;grid-template-columns:1fr;gap:20px}
  @media (min-width:768px){ .landing-grid{grid-template-columns:repeat(3,1fr);gap:24px} }
  .landing-split{display:grid;grid-template-columns:1fr;gap:36px;align-items:center}
  @media (min-width:960px){ .landing-split{grid-template-columns:1.05fr .95fr;gap:64px} }

  .kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;
    height:22px;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.18);font-family:'Space Mono',monospace;
    font-size:11px;color:#B9C7C3}
  .kbd-dark{background:#fff;border:1px solid var(--line);color:var(--muted)}

  .nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;
    border-radius:11px;font-size:14px;font-weight:600;color:#9AB0AB;text-align:left;
    transition:background .15s,color .15s}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#FBF6EA}
  .nav-item.on{background:rgba(227,166,62,.15);color:#E3A63E}
  .disp{font-family:'Fraunces',Georgia,serif}
  .mono{font-family:'Space Mono',monospace}
  button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;color:inherit}
  button:disabled{cursor:not-allowed;opacity:.45}
  input,select{font-family:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);
    font-size:15px;outline:none;background:#fff;color:var(--text)}
  input:focus,select:focus{border-color:var(--teal)}
  a{text-decoration:none}
  .fld{display:block;margin-bottom:16px}
  .fld span{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    color:#5b6e6a;margin-bottom:6px}
  .chip{padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:rgba(255,255,255,.7);
    font-size:14px;font-weight:600;color:var(--text);transition:all .16s;display:inline-flex;align-items:center}
  .chip:hover{background:#fff}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn{width:100%;padding:14px;border-radius:12px;background:var(--teal);color:#fff;font-weight:600;font-size:14px;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-gold{background:var(--gold);color:var(--ink);border-radius:999px;padding:15px 30px;font-weight:600;
    font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:transform .18s}
  .btn-gold:hover{transform:scale(1.04)}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#ccc3aa;border-radius:3px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fadeUp{animation:fadeUp .4s ease-out both}
  @keyframes pulseRing{0%{transform:scale(.92);opacity:.7}70%{transform:scale(1.38);opacity:0}100%{transform:scale(1.38);opacity:0}}
  .ring{animation:pulseRing 1.8s cubic-bezier(.2,.6,.4,1) infinite}
  .ring2{animation:pulseRing 1.8s cubic-bezier(.2,.6,.4,1) .6s infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .breathe{animation:breathe 3.4s ease-in-out infinite}
  @keyframes barA{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .bar{animation:barA .9s ease-in-out infinite;transform-origin:center}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .tdot{animation:blink 1.2s infinite}
  @keyframes spinS{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .spinS{animation:spinS 3s linear infinite}
  @media (prefers-reduced-motion:reduce){.ring,.ring2,.breathe,.bar,.tdot,.spinS,.fadeUp{animation:none!important}}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;
    background:#10282A;color:#B9C7C3;font-family:'Inter',system-ui,sans-serif;text-align:center;z-index:9999}
  #boot .box{max-width:340px}
  #boot h2{font-family:'Fraunces',serif;color:#FBF6EA;font-size:20px;margin:0 0 10px}
  #boot p{font-size:13.5px;line-height:1.6;margin:0 0 8px}
  #boot code{font-family:'Space Mono',monospace;font-size:12px;color:#E3A63E;word-break:break-word}

</style>
